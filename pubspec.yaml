name: fratheli_cafe_web
description: "Site Frathéli Café - Cafés Artesanais"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  provider: ^6.1.2
  url_launcher: ^6.3.0
  intl: ^0.19.0
  mask_text_input_formatter: ^2.9.0
  font_awesome_flutter: ^10.7.0
  shared_preferences: ^2.5.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/banners/
    - assets/premium/
